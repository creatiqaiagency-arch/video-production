<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Nunito'; src: url('fonts/Nunito.ttf'); font-weight: 200 1000; }
@font-face { font-family: 'Caveat'; src: url('fonts/Caveat.ttf'); font-weight: 400 700; }
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script src="post.js"></script>
<script src="character.js"></script>
<script src="fx.js"></script>
<script src="sets.js"></script>
<script src="sets2.js"></script>
<script>
  window.ENGINE_FILES_LOADED = true;
  window.boot = async (tl, env, shotFiles) => {
    E.TL = tl; E.ENV = env;
    for (const f of shotFiles) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = () => rej(new Error('load ' + f)); document.body.appendChild(s); });
    }
    E.SHOTS = E.SHOTS.filter(s => !s.test || E.TL.test); E.SHOTS.sort((a, b) => a.t0 - b.t0); if (E.retime && !E.TL.noRetime) E.retime(E.SHOTS, E.TL.total); E.SHOTS.forEach((s, i) => { s.t1 = i + 1 < E.SHOTS.length ? E.SHOTS[i + 1].t0 : E.TL.total; });
    await document.fonts.load('900 40px Nunito'); await document.fonts.load('700 40px Caveat'); await document.fonts.load('600 40px Nunito');
    return E.SHOTS.map(s => ({ id: s.id, t0: +s.t0.toFixed(3), t1: +s.t1.toFixed(3), dur: +(s.t1 - s.t0).toFixed(3), type: s.type || '', desc: s.desc || '' }));
  };
  const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
  window.renderFrame = (t) => {
    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,1920,1080);
    const s = E.findShot(t);
    const lt = t - s.t0;
    ctx.save(); s.draw(ctx, lt, t, s); ctx.restore();
    ctx.setTransform(1,0,0,1,0,0); ctx.filter='none'; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    E.post(ctx, t, Object.assign({}, s.post ? (typeof s.post === 'function' ? s.post(lt, t) : s.post) : {}));
    if (window.DEBUG_LABEL) { ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,1018,1920,62); ctx.fillStyle='#ffe28a'; ctx.font='600 30px Nunito'; ctx.fillText(`${s.id}  t=${t.toFixed(2)}  shot ${lt.toFixed(2)}/${(s.t1-s.t0).toFixed(2)}`, 20, 1060); }
  };
  window.grab = (q) => cv.toDataURL('image/jpeg', q || 0.93).slice(23);
</script>
</body></html>
